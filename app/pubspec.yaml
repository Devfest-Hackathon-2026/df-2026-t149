name: uramichi
description: 逆張り観光アプリ「ウラミチ」
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  firebase_auth: any
  firebase_core: any
  google_maps_flutter: any
  http: any
  google_fonts: ^8.0.0
  url_launcher: any
  dynamic_color: ^1.7.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  workmanager: ^0.10.10
  google_sign_in: ^7.2.0
  share_plus: ^13.3.1
  audioplayers: ^6.8.1
  budoux_dart: ^1.3.0
  pointer_interceptor: ^0.10.1+3
  image_picker: ^1.2.4
  flutter_local_notifications: ^22.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  generate: true
  uses-material-design: true
  assets:
    - packages/budoux_dart/models/ja.json
    # 書体を同梱し、起動のたびにネットワークから読み込まない（google_fonts は assets の同名のファイルを先に使う）
    - assets/google_fonts/
    - assets/config/
    - assets/mock/
    - assets/images/
    - assets/sounds/
