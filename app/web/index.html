<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="近くにある、まだ知られていない場所を見つける観光アプリ">
  <meta name="theme-color" content="#1F5136">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ウラミチ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ウラミチ</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <noscript>ウラミチを表示するには、ブラウザで JavaScript を有効にしてください。</noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- 地図のキー（maps_config.js）があれば Maps JavaScript API を読み込み、アプリは読み込みの完了を待って Google マップを使う。ブラウザの言語が英語でも地名を日本語で表示する -->
  <script src="maps_config.js"></script>
  <script>
    window.uramichiMapsReady = new Promise(function (resolve, reject) {
      var key = window.uramichiMapsApiKey;
      if (!key) {
        reject(new Error('maps_config.js がありません'));
        return;
      }
      var script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&language=ja&region=JP';
      script.onload = function () { resolve(true); };
      script.onerror = function () { reject(new Error('Maps JavaScript API を読み込めませんでした')); };
      document.head.appendChild(script);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
